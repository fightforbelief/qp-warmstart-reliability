[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qpwr"
version = "0.1.0"
description = "Independent benchmark of learned warm starts for parametric convex QPs."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "matplotlib",
  "pyyaml",
  "osqp",
  "cvxpy",
]

[tool.setuptools.packages.find]
where = ["src"]
